<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>2048</title>
<meta name="description" content="Игра 2048: стрелки на клавиатуре или свайпы на телефоне.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3EFE9;--board:#B9AD9F;--cell:#D3C9BC;--ink:#4C4238;--gap:12px}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 Rubik,system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;justify-content:center;min-height:100vh;touch-action:none}
main{width:min(480px,94vw);padding:2rem 0}
header{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1rem}
h1{font-size:3.6rem;font-weight:900;margin:0;line-height:1}
.scores{display:flex;gap:.4rem}
.score{background:var(--board);color:#fff;border-radius:8px;padding:.3rem .9rem;text-align:center;min-width:80px}
.score small{display:block;font-size:.72rem;opacity:.85}
.score b{font-size:1.3rem}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;gap:.5rem}
.bar p{margin:0;font-size:.95rem}
.bar span{display:flex;gap:.4rem;flex-shrink:0}
button{font:700 .95rem Rubik,sans-serif;border:0;border-radius:8px;padding:.6em 1em;background:var(--ink);color:#fff;cursor:pointer}
button[disabled]{opacity:.35;cursor:default}
:focus-visible{outline:3px solid #E07A3F;outline-offset:2px}
.board{position:relative;background:var(--board);border-radius:12px;padding:var(--gap);aspect-ratio:1;display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap)}
.cell{background:var(--cell);border-radius:8px}
.tiles{position:absolute;inset:var(--gap)}
.tile{position:absolute;width:calc((100% - 3 * var(--gap)) / 4);height:calc((100% - 3 * var(--gap)) / 4);border-radius:8px;display:grid;place-items:center;font-weight:700;
  font-size:clamp(1.4rem,7vw,2.6rem);transition:transform .11s ease-in-out}
.tile.new{animation:pop .16s ease-out}
.tile.merged{animation:bump .16s ease-out}
@keyframes pop{from{scale:.3;opacity:0}to{scale:1;opacity:1}}
@keyframes bump{50%{scale:1.15}}
.overlay{position:absolute;inset:0;border-radius:12px;background:rgba(243,239,233,.8);display:none;flex-direction:column;align-items:center;justify-content:center;gap:1rem;z-index:5;text-align:center}
.overlay.show{display:flex}
.overlay h2{font-size:2.4rem;margin:0}
.help{margin-top:1.2rem;font-size:.9rem;opacity:.8}
@media (prefers-reduced-motion:reduce){.tile{transition:none}.tile.new,.tile.merged{animation:none}}
</style>
</head>
<body>
<main>
  <header>
    <h1>2048</h1>
    <div class="scores">
      <div class="score"><small>Счёт</small><b id="score" aria-live="polite">0</b></div>
      <div class="score"><small>Рекорд</small><b id="best">0</b></div>
    </div>
  </header>
  <div class="bar">
    <p>Соединяйте плитки и доберитесь до <b>2048</b>.</p>
    <span><button id="undo" type="button" disabled>Отменить ход</button> <button id="restart" type="button">Заново</button></span>
  </div>
  <div class="board" id="board" role="application" aria-label="Игровое поле 4 на 4. Управление стрелками или свайпами." tabindex="0">
    <div class="tiles" id="tiles"></div>
    <div class="overlay" id="overlay"><h2 id="ovTitle"></h2><p id="ovText"></p><div><button id="ovBtn" type="button"></button></div></div>
  </div>
  <p class="help">Компьютер: стрелки или WASD. Телефон: свайпы по полю. Z — отменить ход.</p>
</main>
<script>
const SIZE = 4;
const COLORS = {2:['#EEE4DA','#776E65'],4:['#EDE0C8','#776E65'],8:['#F2B179','#fff'],16:['#F59563','#fff'],32:['#F67C5F','#fff'],64:['#F65E3B','#fff'],
  128:['#EDCF72','#fff'],256:['#EDCC61','#fff'],512:['#EDC850','#fff'],1024:['#EDC53F','#fff'],2048:['#EDC22E','#fff']};
const $ = s => document.querySelector(s);
const store = {get:(k,f) => {try{return JSON.parse(localStorage.getItem(k)) ?? f}catch{return f}}, set:(k,v) => {try{localStorage.setItem(k, JSON.stringify(v))}catch{}}};
let grid, score, best = store.get('2048-best', 0), history = [], won = false, keepPlaying = false, nextId = 1;

function empty(){ return Array.from({length: SIZE}, () => Array(SIZE).fill(null)); }
function addRandom(){
  const free = [];
  grid.forEach((row, r) => row.forEach((c, k) => { if (!c) free.push([r, k]); }));
  if (!free.length) return;
  const [r, c] = free[Math.floor(Math.random() * free.length)];
  grid[r][c] = {id: nextId++, v: Math.random() < .9 ? 2 : 4, isNew: true};
}
function start(saved){
  if (saved) { grid = saved.grid; score = saved.score; won = saved.won; keepPlaying = saved.keepPlaying; nextId = saved.nextId; }
  else { grid = empty(); score = 0; won = false; keepPlaying = false; addRandom(); addRandom(); }
  history = []; $('#overlay').classList.remove('show'); render();
  if (saved) check(); // сохранённая партия могла закончиться без ходов
}

// Сдвиг одной линии влево с объединением одинаковых плиток (каждая плитка сливается один раз за ход)
function slide(line){
  const tiles = line.filter(Boolean), out = []; let gained = 0;
  for (let i = 0; i < tiles.length; i++) {
    if (tiles[i + 1] && tiles[i].v === tiles[i + 1].v) {
      const v = tiles[i].v * 2; out.push({id: tiles[i].id, v, merged: true}); gained += v; i++;
    } else out.push({id: tiles[i].id, v: tiles[i].v});
  }
  while (out.length < SIZE) out.push(null);
  return {line: out, gained};
}
function move(dir){ // 0 влево, 1 вверх, 2 вправо, 3 вниз
  if ($('#overlay').classList.contains('show')) return;
  const before = JSON.stringify(grid.map(r => r.map(c => c && c.v)));
  const snapshot = {grid: grid.map(r => r.map(c => c && {id: c.id, v: c.v})), score, won, keepPlaying};
  let gained = 0;
  for (let i = 0; i < SIZE; i++) {
    let line = [];
    for (let j = 0; j < SIZE; j++) {
      const [r, c] = dir === 0 ? [i, j] : dir === 2 ? [i, SIZE - 1 - j] : dir === 1 ? [j, i] : [SIZE - 1 - j, i];
      line.push(grid[r][c]);
    }
    const res = slide(line); gained += res.gained;
    for (let j = 0; j < SIZE; j++) {
      const [r, c] = dir === 0 ? [i, j] : dir === 2 ? [i, SIZE - 1 - j] : dir === 1 ? [j, i] : [SIZE - 1 - j, i];
      grid[r][c] = res.line[j];
    }
  }
  if (JSON.stringify(grid.map(r => r.map(c => c && c.v))) === before) return;
  history.push(snapshot); if (history.length > 20) history.shift();
  score += gained; if (score > best) { best = score; store.set('2048-best', best); }
  addRandom(); render(); check();
}
function canMove(){
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
    const v = grid[r][c] && grid[r][c].v;
    if (!v) return true;
    if (c < SIZE - 1 && grid[r][c + 1] && grid[r][c + 1].v === v) return true;
    if (r < SIZE - 1 && grid[r + 1][c] && grid[r + 1][c].v === v) return true;
  }
  return false;
}
function overlay(title, text, btn){ $('#ovTitle').textContent = title; $('#ovText').textContent = text; $('#ovBtn').textContent = btn; $('#overlay').classList.add('show'); $('#ovBtn').focus(); }
function check(){
  if (!won && grid.flat().some(c => c && c.v >= 2048)) { won = true; overlay('Победа!', `Вы собрали 2048. Счёт: ${score}.`, 'Играть дальше'); return; }
  if (!canMove()) overlay('Ходов больше нет', `Ваш счёт: ${score}. Рекорд: ${best}.`, 'Новая игра');
}
function render(){
  const tiles = $('#tiles'), seen = new Set();
  grid.forEach((row, r) => row.forEach((t, c) => {
    if (!t) return; seen.add(String(t.id));
    let el = tiles.querySelector(`[data-id="${t.id}"]`);
    if (!el) { el = document.createElement('div'); el.className = 'tile'; el.dataset.id = t.id; tiles.appendChild(el); }
    const [bg, fg] = COLORS[t.v] || ['#3C3A32', '#fff'];
    el.style.background = bg; el.style.color = fg; el.textContent = t.v;
    el.style.fontSize = t.v >= 1024 ? 'clamp(1rem,5vw,1.9rem)' : '';
    el.style.transform = `translate(calc(${c} * (100% + var(--gap))), calc(${r} * (100% + var(--gap))))`;
    el.classList.toggle('new', !!t.isNew); el.classList.toggle('merged', !!t.merged);
    delete t.isNew; delete t.merged;
  }));
  [...tiles.children].forEach(el => { if (!seen.has(el.dataset.id)) el.remove(); });
  $('#score').textContent = score; $('#best').textContent = best;
  $('#undo').disabled = !history.length;
  store.set('2048-game', {grid, score, won, keepPlaying, nextId});
}

const KEYS = {ArrowLeft:0, ArrowUp:1, ArrowRight:2, ArrowDown:3, a:0, w:1, d:2, s:3, ф:0, ц:1, в:2, ы:3};
document.addEventListener('keydown', e => {
  if (e.key in KEYS && !e.altKey && !e.ctrlKey && !e.metaKey) { e.preventDefault(); move(KEYS[e.key]); }
  if ((e.key === 'z' || e.key === 'я') && !e.ctrlKey) undo();
});
let sx, sy;
$('#board').addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive: true});
$('#board').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 30) return;
  move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 2 : 0) : (dy > 0 ? 3 : 1));
});
function undo(){ const h = history.pop(); if (!h) return; grid = h.grid; score = h.score; won = h.won; keepPlaying = h.keepPlaying; $('#overlay').classList.remove('show'); $('#tiles').innerHTML = ''; render(); }
$('#undo').onclick = undo;
$('#restart').onclick = () => { $('#tiles').innerHTML = ''; start(); };
$('#ovBtn').onclick = () => { if (won && !keepPlaying && canMove()) { keepPlaying = true; $('#overlay').classList.remove('show'); } else { $('#tiles').innerHTML = ''; start(); } };
$('#board').insertAdjacentHTML('afterbegin', '<div class="cell"></div>'.repeat(SIZE * SIZE));
start(store.get('2048-game', null));
</script>
</body>
</html>
